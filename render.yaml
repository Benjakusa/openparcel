services:
  # PostgreSQL Database for the application
  - type: pgo
    name: opendesk-parcel-db
    databaseName: opendesk_parcel
    user: opendesk_user
    plan: free
    region: frankfurt

  # Express Backend API
  - type: web
    name: opendesk-parcel-api
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opendesk-parcel-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
    rootDir: backend
